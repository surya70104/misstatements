# Continuous integration for the Misstatements Rollup.
#
# Three jobs, the same commands README.md gives for a developer's machine:
#   1. lint            ruff, ruff format, mypy strict; eslint, prettier, tsc
#   2. frontend-tests  vitest
#   3. backend-tests   pytest twice: on the in-memory stand-in, then on PostgreSQL 16
#
# Nothing here reaches any real system. The PostgreSQL server is a throwaway service
# container created for the job and destroyed with it, set up by the project's own
# scripts/db/02_create.sql. The tests run against oak_misstatements_test only and roll back.
# The Financial Spine is the test double in backend/tests/fake_spine.py. The passwords below
# belong to that container alone: they protect nothing and are not secrets.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/pyproject.toml

      - name: Install the backend with its development tools
        run: python -m pip install -c backend/requirements-lock.txt -e "backend[dev]"

      - name: ruff check
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff check --config pyproject.toml ../scripts

      - name: ruff format --check
        working-directory: backend
        run: |
          python -m ruff format --check .
          python -m ruff format --check --config pyproject.toml ../scripts

      - name: mypy (strict)
        working-directory: backend
        run: |
          python -m mypy
          python -m mypy ../scripts/seed_demo.py

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: prettier --check
        working-directory: frontend
        run: npm run format

      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      - name: vitest
        working-directory: frontend
        run: npm test

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/pyproject.toml

      - name: Install the backend with its development tools
        run: python -m pip install -c backend/requirements-lock.txt -e "backend[dev]"

      # With no OAK_TEST_DATABASE_URL the suite runs on the in-memory stand-in and skips
      # the tests marked "db" (architecture D24).
      - name: pytest on the in-memory stand-in
        working-directory: backend
        run: python -m pytest

      # The two roles and two databases, exactly as a person creates them (README,
      # "Database: one-time creation"), then the two passwords.
      - name: Create the roles and databases
        env:
          PGPASSWORD: ci-superuser
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d postgres -f scripts/db/02_create.sql
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d postgres \
            -c "ALTER ROLE oak_misstatements_owner PASSWORD 'ci-owner'" \
            -c "ALTER ROLE oak_misstatements_app PASSWORD 'ci-app'"

      # The suite migrates oak_misstatements_test to head itself and rolls every test back.
      # The owner URL migrates and inserts; the app URL proves the application role cannot
      # update or delete append-only rows.
      - name: pytest on PostgreSQL
        working-directory: backend
        env:
          OAK_TEST_DATABASE_URL: postgresql+psycopg://oak_misstatements_owner:ci-owner@localhost:5432/oak_misstatements_test
          OAK_TEST_APP_DATABASE_URL: postgresql+psycopg://oak_misstatements_app:ci-app@localhost:5432/oak_misstatements_test
        run: python -m pytest
